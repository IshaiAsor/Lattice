# Development overlay — adds every app service currently missing from compose.yaml
# (api, mqtt-service, device-gateway, socket-server, digest-service, automation-worker,
# ml-router, ml-executor, backoffice), on the SAME ports/infra/.env as normal local dev.
#
# Unlike compose.test.yaml (a separate, disposable stack with its own DB/creds for
# tests/e2e), this file is an overlay merged on top of the real compose.yaml — it reuses
# your existing postgres/emqx/rabbitmq/cache containers and root .env, so it's meant to sit
# alongside your everyday dev DB, not replace it.
#
# The point: bring the whole suite up in Docker, then swap ONE service out to iterate on
# locally — since it's on the same port, nothing else needs reconfiguring:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
#   docker compose -f compose.yaml -f compose.dev.yaml stop api
#   cd services/api && npm run dev          # now serving on :3000, same as the container did
#   docker compose -f compose.yaml -f compose.dev.yaml start api   # put it back when done
#
# Ports match backoffice/src/environments/environment.development.ts (api 3100, device-gateway
# 3004, socket-server 3007) and each service's own env.config.ts default otherwise.

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: api
    ports:
      - '3100:3000'
    environment:
      # Images set NODE_ENV=production, so the logger's dev default (debug) never applies
      # in this stack — set it explicitly. Override with LOG_LEVEL=info in .env for quiet runs.
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      # Dev/test only: a full e2e run makes thousands of requests and logs in dozens of
      # times, all from one IP. Production keeps the strict defaults from env.config
      # (10 logins / 150 requests per 15 min).
      - AUTH_RATE_LIMIT_MAX_ATTEMPTS=10000
      - RATE_LIMIT_MAX_REQUESTS=100000
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - DATABASE_URL=postgresql://${BACKEND_DB_USER}:${BACKEND_DB_PASSWORD}@postgres:5432/${DB_NAME:-emqx_data}?sslmode=disable
      # Public VAPID key only, served to the browser for push subscription — same value as
      # notification-service's VAPID_PUBLIC_KEY below (api never needs the private key).
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      # Google sign-in: the api exchanges the OAuth auth-code itself (auth.routes /google →
      # google.service.getUserFromCode), so it needs the same client id/secret as google-home.
      - GOOGLE_SIGN_IN_CLIENT_ID=${GOOGLE_SIGN_IN_CLIENT_ID}
      - GOOGLE_SIGN_IN_CLIENT_SECRET=${GOOGLE_SIGN_IN_CLIENT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:4200}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: always

  device-gateway:
    build:
      context: .
      dockerfile: services/device-gateway/Dockerfile
    container_name: device-gateway
    ports:
      - '3004:3004'
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - PORT=3004
      - JWT_SECRET=${JWT_SECRET}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - DATABASE_URL=postgresql://${BACKEND_DB_USER}:${BACKEND_DB_PASSWORD}@postgres:5432/${DB_NAME:-emqx_data}?sslmode=disable
      # Embedded in provisioning responses returned to devices — must be reachable FROM THE DEVICE.
      # `localhost` only works when the "device" runs on this host (device-sim). Real hardware on
      # the LAN needs this host's LAN IP, so set DEVICE_GATEWAY_URL / MQTT_SERVER_NAME /
      # OTA_MANAGER_URL in .env when testing against a board.
      # Browser origins allowed to call this service. Same-origin paths (the api behind
      # /api on the tunnel host) never need it; device-gateway has its own host, so the
      # backoffice reaches it cross-origin and is refused without an entry here.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:4200}
      - DEVICE_GATEWAY_URL=${DEVICE_GATEWAY_URL:-http://localhost:3004}
      - OTA_MANAGER_URL=${OTA_MANAGER_URL:-http://localhost:3001}
      - MQTT_SERVER_NAME=${MQTT_SERVER_NAME:-localhost}
      # The port advertised TO DEVICES, distinct from the internal 1883 that mqtt-service and
      # device-sim use: a board reaching the broker over the public tunnel connects on 8883,
      # where Traefik terminates TLS and forwards plaintext down to the local broker.
      - MQTT_PORT=${DEVICE_MQTT_PORT:-1883}
      - MQTT_VALIDATE_CERT=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: always

  mqtt-service:
    build:
      context: .
      dockerfile: services/mqtt-service/Dockerfile
    container_name: mqtt-service
    ports:
      - '3005:3005'
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - PORT=3005
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - MQTT_INTERNAL_HOST=emqx
      - MQTT_PORT=1883
      - MQTT_APP_USERNAME=${MQTT_APP_USERNAME}
      - MQTT_APP_PASSWORD=${MQTT_APP_PASSWORD}
      - MQTT_CLIENT_ID=mqtt-service
      - MQTT_VALIDATE_CERT=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - emqx
      - rabbitmq
    restart: always

  socket-server:
    build:
      context: .
      dockerfile: services/socket-server/Dockerfile
    container_name: socket-server
    ports:
      - '3007:3007'
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - PORT=3007
      - JWT_SECRET=${JWT_SECRET}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - VALKEY_URL=redis://${REDIS_USER}:${REDIS_PASSWORD}@cache:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      rabbitmq:
        condition: service_healthy
      cache:
        condition: service_started
    restart: always

  digest-service:
    build:
      context: .
      dockerfile: services/digest-service/Dockerfile
    container_name: digest-service
    ports:
      - '3006:3006'
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - PORT=3006
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - DATABASE_URL=postgresql://${BACKEND_DB_USER}:${BACKEND_DB_PASSWORD}@postgres:5432/${DB_NAME:-emqx_data}?sslmode=disable
      - VALKEY_URL=redis://${REDIS_USER}:${REDIS_PASSWORD}@cache:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      cache:
        condition: service_started
    restart: always

  automation-worker:
    build:
      context: .
      dockerfile: services/automation-worker/Dockerfile
    container_name: automation-worker
    ports:
      - '3008:3008'
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - PORT=3008
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - DATABASE_URL=postgresql://${BACKEND_DB_USER}:${BACKEND_DB_PASSWORD}@postgres:5432/${DB_NAME:-emqx_data}?sslmode=disable
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: always

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    ports:
      - '3011:3011'
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - PORT=3011
      # Tags outbound (email/push) notifications with the environment they were sent from, so a
      # local or staging alert is never mistaken for a prod one. Only "production" is untagged.
      - LATTICE_ENV=${LATTICE_ENV:-development}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - DATABASE_URL=postgresql://${BACKEND_DB_USER}:${BACKEND_DB_PASSWORD}@postgres:5432/${DB_NAME:-emqx_data}?sslmode=disable
      - VALKEY_URL=redis://${REDIS_USER}:${REDIS_PASSWORD}@cache:6379
      # Local email goes to Mailpit (catcher w/ web UI at http://localhost:8025) so the
      # verify-email / reset-password flows are testable without a real SMTP provider. Push
      # (VAPID) stays unset → no-op. Override SMTP_HOST to use a real provider.
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-Lattice <no-reply@lattice.local>}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      cache:
        condition: service_started
    restart: always

  # Local email catcher — the notification-service email adapter points here in dev. SMTP on
  # 1025, web inbox at http://localhost:8025 (verify-email / reset-password links land here).
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - '8025:8025'
      - '1025:1025'
    restart: always

  ml-router:
    build:
      context: .
      dockerfile: services/ml-router/Dockerfile
    container_name: ml-router
    ports:
      - '3009:3009'
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - PORT=3009
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - DATABASE_URL=postgresql://${BACKEND_DB_USER}:${BACKEND_DB_PASSWORD}@postgres:5432/${DB_NAME:-emqx_data}?sslmode=disable
      - VALKEY_URL=redis://${REDIS_USER}:${REDIS_PASSWORD}@cache:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      cache:
        condition: service_started
    restart: always

  ml-executor:
    build:
      context: .
      dockerfile: services/ml-executor/Dockerfile
    container_name: ml-executor
    ports:
      - '3002:3002'
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - PORT=3002
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - VALKEY_URL=redis://${REDIS_USER}:${REDIS_PASSWORD}@cache:6379
      # Remote OpenAI-compatible LLM keys (optional — a model whose key is unset just errors
      # when invoked). Pass through from host env / root .env; see models.json entries.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - rabbitmq
      - cache
    restart: always

  # Angular UI, built with the `development` config (see backoffice/Dockerfile's
  # `runtime-test` stage) so it resolves the localhost:* ports above instead of the
  # production subdomain-derivation scheme.
  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile
      target: runtime-test
    container_name: backoffice
    ports:
      - '4200:80'
    depends_on:
      - api
      - device-gateway
      - socket-server
    restart: always

  # Software device fleet (tools/device-sim) — provisions + drives a small mixed fleet against
  # the stack so there's something to see/debug in the backoffice without real hardware. Fleet
  # composition lives in tools/device-sim/fleet.dev.json (committed — edit to change it).
  device-sim:
    build:
      context: .
      dockerfile: tools/device-sim/Dockerfile
    container_name: device-sim
    # device-gateway embeds "http://localhost:<port>/..." callback URLs in its provisioning
    # response (so the host-run Jest e2e suite can reach it) — this container has no other way
    # to resolve those, so make "localhost" here mean the Docker host instead of itself. The
    # request then round-trips back in through the host-published port into the right container.
    extra_hosts:
      - 'localhost:host-gateway'
    environment:
      - API_URL=http://api:3000
      - DEVICE_GATEWAY_URL=http://device-gateway:3004
      - MQTT_SERVER_NAME=emqx
      - MQTT_PORT=1883
      # Timezone for the camera-frame timestamp burned by lib/jpeg.js. Set TZ in your .env (e.g.
      # TZ=Asia/Jerusalem) to make frames read in local wall-clock time; defaults to UTC.
      - TZ=${TZ:-UTC}
      - SIM_USER=${OWNER_USERNAME:-admin}
      - SIM_PASS=${OWNER_PASSWORD:-admin}
      - FLEET_CONFIG=fleet.dev.json
      - PERSIST=false
      # Deliberately false. On shutdown the sim used to DELETE each device it had provisioned, and
      # `blueprint_slot_bindings.user_device_id` cascades — so every `dev:down`, and every recreate
      # of this container, silently emptied every blueprint setup of its bound devices and nulled
      # the device ids on all of `device_commands`. Provisioning upserts by MAC and the fleet's MACs
      # are deterministic, so leaving the rows in place is what makes a setup survive a restart.
      # Set it back to true only for a run whose whole point is starting from an empty fleet.
      - CLEANUP_ON_EXIT=false
    depends_on:
      - api
      - device-gateway
      - mqtt-service
    restart: always

  # Reverse tunnel to the cluster, giving this machine public HTTPS + MQTT endpoints.
  # Server side: oci-k3s-gitops k8s/base/infra-access/frp-tunnel.yaml — routing in ./frpc.toml.
  #
  # Behind a `tunnel` profile so a normal `dev:up` never starts it: while it runs, this stack is
  # on the public internet. Start it only when testing Google Home linking or real hardware:
  #   docker compose -f compose.yaml -f compose.dev.yaml --profile tunnel up -d frpc
  #
  # Runs as a container rather than a host binary for two reasons: container-to-container is the
  # reliable path (Docker Desktop's WSL2 backend publishes ports to loopback only), and the
  # endpoint AV classifies the frp binary as riskware — reverse tunnels are a common exfiltration
  # tool, so the detection is about the capability, not this build.
  frpc:
    image: fatedier/frpc:v0.70.1
    container_name: frpc
    profiles: ['tunnel']
    command: ['-c', '/etc/frp/frpc.toml']
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    environment:
      # Same value as the sealed frp-auth secret in the cluster.
      - FRP_TOKEN=${FRP_TOKEN}
    extra_hosts:
      # `ng serve` runs on the host, not in compose.
      - 'host.docker.internal:host-gateway'
    depends_on:
      - api
      - device-gateway
      - google-home
    restart: unless-stopped
