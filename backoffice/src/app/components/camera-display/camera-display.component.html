<div class="camera-display" (click)="openFullscreen()" (keydown.enter)="openFullscreen()" tabindex="0" role="button" [matTooltip]="'Click to expand'">
  @if (action().state) {
  <img [src]="'data:image/jpeg;base64,' + action().state" alt="Camera" class="camera-img" />
  } @else {
  <div class="camera-placeholder">
    <span class="material-symbols-outlined">photo_camera</span>
    <span>No image yet</span>
  </div>
  }
  <button
    mat-icon-button
    class="capture-btn"
    [disabled]="capturing() || !action().online"
    (click)="captureNow($event)"
    (keydown.enter)="$event.stopPropagation()"
    [matTooltip]="action().online ? 'Capture now' : 'Device is offline'"
    aria-label="Capture now"
  >
    <!-- `autorenew`, not Material Symbols' `progress_activity`: mat-icon renders the classic
         Material Icons font, where that newer glyph does not exist and shows as an empty circle. -->
    <mat-icon [class.spinning]="capturing()">{{ capturing() ? 'autorenew' : 'add_a_photo' }}</mat-icon>
  </button>
</div>
