<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="144" height="144" rx="32" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="#ffffff">
    <!-- spokes: center (72,72) -> 6 hexagon nodes (R=40) -->
    <line x1="72" y1="72" x2="72" y2="32"/>
    <line x1="72" y1="72" x2="106.64" y2="52"/>
    <line x1="72" y1="72" x2="106.64" y2="92"/>
    <line x1="72" y1="72" x2="72" y2="112"/>
    <line x1="72" y1="72" x2="37.36" y2="92"/>
    <line x1="72" y1="72" x2="37.36" y2="52"/>
    <!-- outer nodes -->
    <circle cx="72" cy="32" r="8.5"/>
    <circle cx="106.64" cy="52" r="8.5"/>
    <circle cx="106.64" cy="92" r="8.5"/>
    <circle cx="72" cy="112" r="8.5"/>
    <circle cx="37.36" cy="92" r="8.5"/>
    <circle cx="37.36" cy="52" r="8.5"/>
    <!-- center node -->
    <circle cx="72" cy="72" r="12.5"/>
  </g>
</svg>
