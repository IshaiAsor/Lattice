name: 'Bump version tag'
description: 'Computes the next global vX.Y.Z patch tag and pushes it, retrying if a concurrent workflow wins the race'
outputs:
  new_tag:
    description: 'The tag that was created and pushed'
    value: ${{ steps.bump.outputs.new_tag }}
runs:
  using: 'composite'
  steps:
    - id: bump
      shell: bash
      run: |
        set -eu
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        for attempt in $(seq 1 30); do
          git fetch --tags --force origin >/dev/null 2>&1

          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n1)

          if [ -z "$latest" ]; then
            new_tag="v0.0.1"
          else
            major=$(echo "$latest" | cut -d. -f1)
            minor=$(echo "$latest" | cut -d. -f2)
            patch=$(echo "$latest" | cut -d. -f3)
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi

          if git tag "$new_tag" && git push origin "refs/tags/$new_tag" 2>/tmp/push_err.log; then
            echo "Tagged $new_tag"
            echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Attempt $attempt: push of $new_tag was rejected (concurrent bump), retrying"
          cat /tmp/push_err.log || true
          git tag -d "$new_tag" >/dev/null 2>&1 || true
          sleep "$(( (RANDOM % 4) + 1 ))"
        done

        echo "::error::Failed to push a new version tag after multiple retries"
        exit 1
