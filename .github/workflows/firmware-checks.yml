name: Firmware Checks

# Quality gate for ESP32Code — format, native unit tests, static analysis, and a compile
# smoke test. Separate from esp32-ota-ci.yml (which only builds prod images on push to master)
# so PRs get a gate without carrying the image/version-tag machinery. Paths-filtered so it
# only runs when firmware actually changes.
on:
  push:
    branches: ['master']
    paths: ['ESP32Code/**']
  pull_request:
    branches: ['master']
    paths: ['ESP32Code/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install clang-format (pinned)
        run: npm ci
      # src/certs/ is format-disabled via its own .clang-format (PEM literals). --dry-run -Werror
      # fails the job on any diff, matching the local lint-staged clang-format -i.
      - name: clang-format check
        working-directory: ESP32Code
        run: |
          FILES=$(find src test tools/manifest-gen/src -type f \( -name '*.h' -o -name '*.cpp' \))
          npx clang-format --dry-run -Werror --style=file $FILES

  native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Native unit tests
        working-directory: ESP32Code
        run: pio test -e native

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO + cppcheck
        run: |
          pip install platformio
          sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck
        working-directory: ESP32Code
        run: pio check -e esp32s3_mini-test --fail-on-defect high --fail-on-defect medium

  # Enumerate the hardware envs so the size gate below fans out over all of them. Reads the
  # [env:...] headers rather than default_envs: an env left out of default_envs still gets flashed
  # to a device, so it still has to fit its slot.
  firmware-envs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        working-directory: ESP32Code
        run: |
          ENVS=$(sed -n 's/^\[env:\(.*\)\]/\1/p' platformio.ini | tr -d '\r' | grep -v '^native$' | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "envs=$ENVS" >> "$GITHUB_OUTPUT"
          echo "$ENVS"

  # Compile + size gate for every hardware env. This subsumes the old two-env compile smoke test:
  # building all of them IS the smoke test, and each one is measured against its own OTA slot.
  #
  # Runs on push as well as PR. The previous job was `if: github.event_name == 'pull_request'`
  # while this repo commits straight to master, so the size gate had effectively never executed —
  # MULTI_SOCKET_8_CH reached 99.75% of its slot without CI ever measuring it.
  size-gate:
    needs: firmware-envs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env-name: ${{ fromJson(needs.firmware-envs.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('ESP32Code/platformio.ini') }}
          # The exact key includes platformio.ini, which CI itself rewrites on every release
          # (DEVICE_VERSION_STR) — so without a prefix fallback each release would cold-download
          # the whole toolchain once per matrix job. The toolchain does not change with a version
          # bump, so restoring a near-miss is both safe and much cheaper.
          restore-keys: |
            ${{ runner.os }}-platformio-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build + size gate (${{ matrix.env-name }})
        working-directory: ESP32Code
        run: ./tools/check-firmware-size.sh "${{ matrix.env-name }}"
