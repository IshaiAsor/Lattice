; Lattice ESP32 firmware — build environments.
;
; Layout: [hw] holds everything shared by the on-device builds; each
; [env:<board>-<test|prod>] `extends = hw` and adds only its board identity + per-device
; build flags. [hw] is a plain section (not [env]) so the host [env:native] test build does
; not inherit the ESP32 toolchain. This comment exists to trigger a fresh firmware CI rerun.
; NOT inherit platform=espressif32/framework=arduino. Two CI parsers read this file
; line-by-line (.github/workflows/esp32-ota-ci.yml matrix step and tools/generate-manifests.mjs):
; DEVICE_TYPE_STR and DEVICE_VERSION_STR must therefore stay inside every -prod section,
; and section headers must keep the [env:...] form.
[platformio]
default_envs =
    esp32s3_mini-test
    esp32s3_mini-prod
    4d_systems_esp32s3_gen4_r8n16-test
    4d_systems_esp32s3_gen4_r8n16-prod
    esp32s3_cam-test
    esp32s3_cam-prod

; Host-native unit tests (pio test -e native) — pure logic only (PayloadValidation,
; TopicBuilder, capability serializer). Not in default_envs, no -prod suffix, so neither CI
; parser sees it. Uses the manifest-gen Arduino.h shim for the serializer path.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I src
    -I tools/manifest-gen/include
lib_deps =
    bblanchon/ArduinoJson@^7.2.2

[hw]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -I src
; Static analysis: `pio check -e <hw-env>` runs cppcheck over src/ only (third-party libs in
; .pio are skipped). Inline false positives with `// cppcheck-suppress <id>`.
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
    +<src/>
check_flags =
    cppcheck: --inline-suppr --std=c++17 --suppress=missingIncludeSystem --suppress=*:*libdeps* --suppress=*:*ArduinoJson* --suppress=preprocessorErrorDirective
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit NeoPixel@^1.15.4
    bblanchon/ArduinoJson@^7.2.2
    links2004/WebSockets@^2.7.3
    ferdiu/ESP32ProvisionToolkit@^1.0.1
    tzapu/WiFiManager@^2.0.17
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.6

[env:esp32s3_mini-test]
extends = hw
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = ota_partitions.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MSC_ON_BOOT=0
    -D ARDUINO_USB_DFU_ON_BOOT=0
    -D ENV_TEST
    -D DEVICE_TYPE_STR=\"ESP32S3_MINI\"
    -D DEVICE_VERSION_STR=\"v2.0.258\"

[env:esp32s3_mini-prod]
extends = hw
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = ota_partitions.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MSC_ON_BOOT=0
    -D ARDUINO_USB_DFU_ON_BOOT=0
    -D ENV_PROD
    -D DEVICE_TYPE_STR=\"ESP32S3_MINI\"
    -D DEVICE_VERSION_STR=\"v2.0.258\"

[env:4d_systems_esp32s3_gen4_r8n16-test]
extends = hw
board = 4d_systems_esp32s3_gen4_r8n16
monitor_filters = esp32_exception_decoder
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_EVENT_RUNNING_NO_AFFINITY
    -D ENV_TEST
    -D DEVICE_TYPE_STR=\"ESP32S3_GEN4_GENERIC\"
    -D DEVICE_VERSION_STR=\"v2.0.258\"

[env:4d_systems_esp32s3_gen4_r8n16-prod]
extends = hw
board = 4d_systems_esp32s3_gen4_r8n16
monitor_filters = esp32_exception_decoder
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_EVENT_RUNNING_NO_AFFINITY
    -D ENV_PROD
    -D DEVICE_TYPE_STR=\"ESP32S3_GEN4_GENERIC\"
    -D DEVICE_VERSION_STR=\"v2.0.258\"

[env:esp32s3_cam-test]
extends = hw
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = s3_cam_partitions.csv
board_build.arduino.memory_type = qio_opi
monitor_filters = esp32_exception_decoder
lib_deps =
    ${hw.lib_deps}
    espressif/esp32-camera
build_flags =
    -I src
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MSC_ON_BOOT=0
    -D ARDUINO_USB_DFU_ON_BOOT=0
    -D ENV_TEST
    -D DEVICE_TYPE_STR=\"ESP32S3_CAM\"
    -D DEVICE_VERSION_STR=\"v2.0.258\"
    -D BOARD_HAS_PSRAM
    -D HAS_CAMERA
    -D PWDN_GPIO_NUM=-1
    -D RESET_GPIO_NUM=-1
    -D XCLK_GPIO_NUM=15
    -D SIOD_GPIO_NUM=4
    -D SIOC_GPIO_NUM=5
    -D Y9_GPIO_NUM=16
    -D Y8_GPIO_NUM=17
    -D Y7_GPIO_NUM=18
    -D Y6_GPIO_NUM=12
    -D Y5_GPIO_NUM=10
    -D Y4_GPIO_NUM=8
    -D Y3_GPIO_NUM=9
    -D Y2_GPIO_NUM=11
    -D VSYNC_GPIO_NUM=6
    -D HREF_GPIO_NUM=7
    -D PCLK_GPIO_NUM=13

[env:esp32s3_cam-prod]
extends = hw
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = s3_cam_partitions.csv
board_build.arduino.memory_type = qio_opi
monitor_filters = esp32_exception_decoder
lib_deps =
    ${hw.lib_deps}
    espressif/esp32-camera
build_flags =
    -I src
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MSC_ON_BOOT=0
    -D ARDUINO_USB_DFU_ON_BOOT=0
    -D ENV_PROD
    -D DEVICE_TYPE_STR=\"ESP32S3_CAM\"
    -D DEVICE_VERSION_STR=\"v2.0.258\"
    -D BOARD_HAS_PSRAM
    -D HAS_CAMERA
    -D PWDN_GPIO_NUM=-1
    -D RESET_GPIO_NUM=-1
    -D XCLK_GPIO_NUM=15
    -D SIOD_GPIO_NUM=4
    -D SIOC_GPIO_NUM=5
    -D Y9_GPIO_NUM=16
    -D Y8_GPIO_NUM=17
    -D Y7_GPIO_NUM=18
    -D Y6_GPIO_NUM=12
    -D Y5_GPIO_NUM=10
    -D Y4_GPIO_NUM=8
    -D Y3_GPIO_NUM=9
    -D Y2_GPIO_NUM=11
    -D VSYNC_GPIO_NUM=6
    -D HREF_GPIO_NUM=7
    -D PCLK_GPIO_NUM=13
