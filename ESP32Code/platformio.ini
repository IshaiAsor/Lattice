; ─────────────────────────────────────────────────────────────────────────────
; Sealed devices — factory-soldered boards for a specific application. Each is a
; clone of a hardware base env above plus the sealed build flag and a product
; DEVICE_TYPE. The flag marks the catalog type is_sealed (via the manifest), so its
; pins/actions come from an admin-composed sealed template, not user config. The
; firmware code is identical to the base; only the catalog identity differs. Sealed
; type NAMES are the sanctioned place for application/vertical wording (see
; iot-smart-home CLAUDE.md) — the capabilities they draw from stay generic.
; NOTE: never write the literal flag token in a comment here — the manifest generator
; and CI matrix parse this file line-by-line and would mis-tag the env above.
; ─────────────────────────────────────────────────────────────────────────────

; MULTI_SOCKET_8_CH — 8-channel socket (i2c_socket_8), on the WROOM (classic ESP32) base.
[env:multi_socket_8ch-test]
extends = hw
board = esp32dev
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = ota_partitions.csv
upload_speed = 115200
upload_resetmethod = default_reset
monitor_filters = esp32_exception_decoder
build_flags =
	-D ENV_TEST
	-D ONBOARD_LED_PIN=2
	-D SEALED
	-D DEVICE_TYPE_STR=\"MULTI_SOCKET_8_CH\"
	-D DEVICE_VERSION_STR=\"v2.0.438\"

[env:multi_socket_8ch-prod]
extends = hw
board = esp32dev
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = ota_partitions.csv
upload_speed = 115200
upload_resetmethod = default_reset
monitor_filters = esp32_exception_decoder
build_flags =
	-D ENV_PROD
	-D ONBOARD_LED_PIN=2
	-D SEALED
	-D DEVICE_TYPE_STR=\"MULTI_SOCKET_8_CH\"
	-D DEVICE_VERSION_STR=\"v2.0.438\"
	; Classic ESP32 (no PSRAM), inherited from the WROOM base — free BLE before the
	; provisioning TLS handshakes so mbedTLS can allocate. See main.cpp teardownBleForTls()
	; and the note on the WROOM env above about re-testing this under NimBLE.
	-D FREE_BLE_BEFORE_TLS

