; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 
	esp32s3_mini-test
	esp32s3_mini-prod
	esp32_wroom32e-test
	esp32_wroom32e-prod
	4d_systems_esp32s3_gen4_r8n16-test
	4d_systems_esp32s3_gen4_r8n16-prod
	esp32s3_cam-test
	esp32s3_cam-prod
	multi_socket_8ch-test
	multi_socket_8ch-prod
	hydro_farm_water_tank_manager-test
	hydro_farm_water_tank_manager-prod
	hydro_farm_pot_monitor-test
	hydro_farm_pot_monitor-prod
	hydro_farm_sensors_controller-test
	hydro_farm_sensors_controller-prod

[env:native]
platform = native
test_framework = unity
build_flags = 
	-std=gnu++17
	-I src
	-I tools/manifest-gen/include
lib_deps = 
	bblanchon/ArduinoJson@^7.2.2
[hw]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
	-I src
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = 
	+<src/>
check_flags = 
	cppcheck: --inline-suppr --std=c++17 --suppress=missingIncludeSystem --suppress=*:*libdeps* --suppress=*:*ArduinoJson* --suppress=preprocessorErrorDirective
lib_deps =
	; BLE provisioning runs on NimBLE, not the Arduino core's Bluedroid. Bluedroid's host stack
	; (libbt.a) was 587 KB — 30% of the image — on a 1.92 MB OTA slot the classic-ESP32 builds
	; had filled to 99.7%. NimBLE compiles from source here and nothing references Bluedroid any
	; more, so the linker stops pulling those archive members in at all. See F3.19.
	h2zero/NimBLE-Arduino@^2.2.0
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit NeoPixel@^1.15.4
	bblanchon/ArduinoJson@^7.2.2
	links2004/WebSockets@^2.7.3
	ferdiu/ESP32ProvisionToolkit@^1.0.1
	tzapu/WiFiManager@^2.0.17
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6

[env:esp32s3_mini-test]
extends = hw
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = ota_partitions.csv
build_flags = 
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MSC_ON_BOOT=0
	-D ARDUINO_USB_DFU_ON_BOOT=0
	-D ENV_TEST
	-D DEVICE_TYPE_STR=\"ESP32S3_MINI\"
	-D DEVICE_VERSION_STR=\"v2.0.438\"

[env:esp32s3_mini-prod]
extends = hw
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = ota_partitions.csv
build_flags = 
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MSC_ON_BOOT=0
	-D ARDUINO_USB_DFU_ON_BOOT=0
	-D ENV_PROD
	-D DEVICE_TYPE_STR=\"ESP32S3_MINI\"
	-D DEVICE_VERSION_STR=\"v2.0.438\"

[env:esp32_wroom32e-test]
extends = hw
board = esp32dev
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = ota_partitions.csv
upload_speed = 115200
upload_resetmethod = default_reset
monitor_filters = esp32_exception_decoder
build_flags = 
	-D ENV_TEST
	-D ONBOARD_LED_PIN=2
	-D DEVICE_TYPE_STR=\"ESP32_WROOM32E\"
	-D DEVICE_VERSION_STR=\"v2.0.438\"

[env:esp32_wroom32e-prod]
extends = hw
board = esp32dev
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = ota_partitions.csv
upload_speed = 115200
upload_resetmethod = default_reset
monitor_filters = esp32_exception_decoder
build_flags = 
	-D ENV_PROD
	-D ONBOARD_LED_PIN=2
	-D DEVICE_TYPE_STR=\"ESP32_WROOM32E\"
	-D DEVICE_VERSION_STR=\"v2.0.438\"
	; Classic ESP32 (no PSRAM): free the BLE stack before the provisioning TLS handshakes so
	; mbedTLS's ~40 KB of record buffers can allocate. See main.cpp teardownBleForTls().
	; (A -D MBEDTLS_* flag can't shrink the precompiled mbedTLS.) NOTE: this dates from the
	; Bluedroid era; NimBLE's host uses far less RAM, so the teardown may now be unnecessary —
	; do not remove it without re-testing provisioning TLS on a real classic-ESP32 board.
	-D FREE_BLE_BEFORE_TLS

